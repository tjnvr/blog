name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.3"

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Setup dependencies
        run: task setup

      - name: Run validate
        run: task validate

      - name: Generate static site
        run: task generate

      - name: Upload site artifact
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: target/build/public/

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    # Deploy prod on push to main, dev on pull requests. The target environment
    # supplies its own AWS_ROLE_ARN / S3_BUCKET / CLOUDFRONT_DISTRIBUTION_ID.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request'
    environment:
      name: ${{ (github.event_name == 'push' && 'tjanvier.org') || 'dev.tjanvier.org' }}
      deployment: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: target/build/public/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@main
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: task deploy:sync
