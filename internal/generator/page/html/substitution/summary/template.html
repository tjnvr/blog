{{- define "node" -}}
<li>
    <a href="#{{.ID}}" class="{{ if eq .Level 2 }}text-sm{{ else }}text-xs{{ end }}">{{.Text}}</a>
    {{- if .Children -}}
        <ul>
            {{- range .Children -}}
                {{- template "node" . -}}
            {{- end -}}
        </ul>
    {{- end -}}
</li>
{{- end -}}

{{- define "toc" -}}
<hr class="border-gray-200 dark:border-gray-700 my-6">
<nav>
    <ul>
        {{- range . -}}
            {{- template "node" . -}}
        {{- end -}}
    </ul>
</nav>
<hr class="border-gray-200 dark:border-gray-700 my-6">
{{- end -}}
