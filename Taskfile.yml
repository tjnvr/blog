version: "3"

env:
  CONTENT_DIR: content/markdown
  BUILD_DIR: target/build
  PUBLIC_DIR: target/build/public
  ASSETS_DIR: content/assets
  ASSETS_OUT_DIR: target/build/public/assets
  SCRIPTS_DIR: scripts
  SCRIPTS_OUT_DIR: target/build/public/scripts

vars:
  IMAGES_DIR: content/assets/images
  GOLANGCI_LINT_VERSION: v2.8.0
  TAILWIND_VERSION: v4.0.6

tasks:
  setup:
    desc: Install all required tools
    cmds:
      - task: setup:go
      - task: setup:tailwind
      - echo "Setup complete!"

  setup:go:
    desc: Install golangci-lint
    cmds:
      - |
        go install golang.org/x/tools/cmd/deadcode@latest
        if command -v golangci-lint &> /dev/null; then
          echo "golangci-lint already installed: $(golangci-lint --version)"
        else
          echo "Installing golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin {{.GOLANGCI_LINT_VERSION}}
          echo "golangci-lint installed successfully"
        fi

  setup:tailwind:
    desc: Download Tailwind standalone CLI
    cmds:
      - |
        if [ -f {{.BUILD_DIR}}/bin/tailwindcss ]; then
          echo "Tailwind CLI already installed"
        else
          echo "Downloading Tailwind CLI {{.TAILWIND_VERSION}}..."
          mkdir -p {{.BUILD_DIR}}/bin
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          if [ "$OS" = "darwin" ] && [ "$ARCH" = "arm64" ]; then
            BINARY="tailwindcss-macos-arm64"
          elif [ "$OS" = "darwin" ]; then
            BINARY="tailwindcss-macos-x64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            BINARY="tailwindcss-linux-arm64"
          else
            BINARY="tailwindcss-linux-x64"
          fi
          curl -sL -o {{.BUILD_DIR}}/bin/tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/{{.TAILWIND_VERSION}}/$BINARY"
          chmod +x {{.BUILD_DIR}}/bin/tailwindcss
          echo "Tailwind CLI installed to {{.BUILD_DIR}}/bin/tailwindcss"
        fi

        # Install typography
        npm install -g @tailwindcss/typography

  go-validate:
    desc: Run all go validation (fmt, lint, test, build)
    cmds:
      - task: fmt:check
      - task: lint
      - task: test
      - task: build

  fmt:
    desc: Format all Go files
    cmds:
      - go mod tidy
      - go fmt ./...

  fmt:check:
    desc: Check if Go files are formatted
    cmds:
      - test -z "$(gofmt -l .)" || (echo "Files not formatted:" && gofmt -l . &&
        exit 1)

  lint:
    desc: Run linters
    cmds:
      - |
        golangci-lint run ./...
        mkdir -p .task
        trap 'rm -f .task/deadcode_output' EXIT
        deadcode -test ./... | tee .task/deadcode_output && [ ! -s .task/deadcode_output ]

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go test ./... -coverprofile={{.BUILD_DIR}}/coverage.out
      - go tool cover -func={{.BUILD_DIR}}/coverage.out

  test:coverage:html:
    desc: Generate HTML coverage report
    cmds:
      - go test ./... -coverprofile={{.BUILD_DIR}}/coverage.out
      - go tool cover -html={{.BUILD_DIR}}/coverage.out -o
        {{.BUILD_DIR}}/coverage.html
      - echo "Coverage report generated at {{.BUILD_DIR}}/coverage.html"

  build:
    desc: Build the Go binary
    sources:
      - go.mod
      - go.sum
      - ./internal/validator/main.go
      - ./internal/generator/main.go
      - ./internal/**/*.go
      - ./internal/**/*.html
      - ./internal/generator/page/page.html
    generates:
      - "{{.BUILD_DIR}}/bin/generate"
      - "{{.BUILD_DIR}}/bin/validate"
    cmds:
      - mkdir -p {{.BUILD_DIR}}/bin
      - go build -o {{.BUILD_DIR}}/bin/generate ./internal/generator/main.go
      - go build -o {{.BUILD_DIR}}/bin/validate ./internal/validator/main.go

  generate:
    desc: Generate the static site
    deps:
      - build
      - css:build
    sources:
      - "{{.BUILD_DIR}}/bin/generate"
      - "{{.CONTENT_DIR}}/**/*.md"
      - "{{.IMAGES_DIR}}/**/*.png"
      - "{{.IMAGES_DIR}}/**/*.jpg"
      - "{{.IMAGES_DIR}}/**/*.jpeg"
      - "{{.IMAGES_DIR}}/**/*.gif"
      - "{{.IMAGES_DIR}}/**/*.svg"
      - "{{.IMAGES_DIR}}/**/*.webp"
      - "{{.IMAGES_DIR}}/**/*.ico"
      - "{{.IMAGES_DIR}}/**/*.avif"
    generates:
      - "{{.PUBLIC_DIR}}/index"
    cmds:
      - ./{{.BUILD_DIR}}/bin/generate --skip-url-validation

  css:build:
    desc: Build Tailwind CSS
    sources:
      - styles/input.css
    generates:
      - "{{.PUBLIC_DIR}}/styles.css"
    cmds:
      - ./{{.BUILD_DIR}}/bin/tailwindcss -i ./styles/input.css -o
        ./{{.PUBLIC_DIR}}/styles.css --minify

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}

  deploy:
    desc: Build, validate, and sync the site to S3 (for deploying from your own computer)
    cmds:
    - task: setup
    - task: go-validate
    - task: generate
    - task: deploy:sync
    - task: validate

  deploy:sync:
    desc: Sync an already-built site to S3 and invalidate CloudFront (used by CI, which already validated and generated in a separate job)
    cmds:
    - |
        if [ -z "$S3_BUCKET" ]; then
          echo "S3_BUCKET environment variable is required" >&2
          exit 1
        fi
        if [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
          echo "CLOUDFRONT_DISTRIBUTION_ID environment variable is required" >&2
          exit 1
        fi
        if [ -z "$BASE_URL" ]; then
          echo "BASE_URL environment variable is required" >&2
          exit 1
        fi

        # sitemap.xml and robots.txt are generated environment-agnostic
        sed "s|__BASE_URL__|$BASE_URL|g" {{.PUBLIC_DIR}}/sitemap.xml > {{.PUBLIC_DIR}}/sitemap.xml.tmp
        mv {{.PUBLIC_DIR}}/sitemap.xml.tmp {{.PUBLIC_DIR}}/sitemap.xml

        sed "s|__BASE_URL__|$BASE_URL|g" {{.PUBLIC_DIR}}/robots.txt > {{.PUBLIC_DIR}}/robots.txt.tmp
        mv {{.PUBLIC_DIR}}/robots.txt.tmp {{.PUBLIC_DIR}}/robots.txt

        # Files with an extension (assets, css, js): let AWS auto-detect content-type
        aws s3 sync {{.PUBLIC_DIR}}/ "s3://$S3_BUCKET/" --delete --exclude "*" --include "*.*"

        # Extensionless files (HTML pages): force text/html
        aws s3 sync {{.PUBLIC_DIR}}/ "s3://$S3_BUCKET/" --delete --exclude "*.*" --content-type "text/html; charset=utf-8"

        # S3 has no real directory hierarchy: unlike a local filesystem, "section" and
        # "section/random-page" can coexist as independent keys.
        #
        # Section index pages are generated locally as "<dir>/index" and renamed
        # server-side to the literal key "<dir>", matching their href exactly.
        # Locally, browser-sync-config.js's middleware fakes this rename per-request instead.
        aws s3api list-objects-v2 --bucket "$S3_BUCKET" \
          --query "Contents[?ends_with(Key, '/index')].Key" --output text |
          tr '\t' '\n' | while IFS= read -r key; do
            [ -z "$key" ] && continue
            newkey="${key%/index}"
            echo "Renaming s3://$S3_BUCKET/$key -> s3://$S3_BUCKET/$newkey"
            aws s3 cp "s3://$S3_BUCKET/$key" "s3://$S3_BUCKET/$newkey" \
              --content-type "text/html; charset=utf-8" --metadata-directive REPLACE
            aws s3 rm "s3://$S3_BUCKET/$key"
          done

        aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

  serve:
    deps:
    - task: generate
    cmds:
        - browser-sync start --no-ui --config browser-sync-config.js

  dev:
    desc: Serve locally with live reload
    watch: true
    deps:
      - task: generate
    cmd: browser-sync reload

  validate:
    desc: Validate the just-deployed site at $BASE_URL
    cmds:
        - |
            if [ -z "$BASE_URL" ]; then
                echo "BASE_URL environment variable is required" >&2
                exit 1
            fi

            ./{{.BUILD_DIR}}/bin/validate --url "$BASE_URL"
